[project]
name = "apex"
version = "0.1.0"
description = "APEX — Personal AI Assistant for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "APEX Project" }
]
dependencies = [
    "PySide6>=6.8.0",
    "pydantic>=2.10.0",
    "keyring>=25.0.0",
    "google-genai>=1.0.0",
    "pyttsx3>=2.90.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
